name: Rename website file to index.html
on:
  push:
    paths:
      - '.github/workflows/rename.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f final-academy-website.html ]; then
            git mv final-academy-website.html index.html
            git config user.name "mariamumtaz318-design"
            git config user.email "mariamumtaz318-design@users.noreply.github.com"
            git commit -m "Rename final-academy-website.html to index.html"
            git push
          else
            echo "final-academy-website.html not found; nothing to rename."
          fi
